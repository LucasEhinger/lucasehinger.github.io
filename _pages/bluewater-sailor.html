    }

    .bw-presets {

    .bw-presets button {

        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 22px;
    }

    .bw-stat-tile {
        flex: 1 1 120px;
        min-width: 110px;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 10px 12px;
        background-color: var(background-color, #fff);
    }

    .bw-stat-value {
        font-size: 1.45em;
        font-weight: 700;
        line-height: 1.1;
        color: var(color, #333);
    }

    .bw-stat-label {
        font-size: 0.78em;
        color: var(color, #666);
        opacity: 0.75;
        margin-top: 4px;
    }

    .bw-table-wrap {
        overflow-x: auto;
        border: 1px solid #ccc;
        border-radius: 8px;
        max-height: 640px;
    }

    table.bw-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9em;
        margin: 0;

        padding: 7px 10px;

    table.bw-table th.bw-num {
        text-align: right;
    }

    table.bw-table td.bw-trip {
        white-space: normal;

    table.bw-table th {

        top: 0;
        background-color: var(--global-thead-color, #e9e9e9);

        z-index: 1;

    table.bw-table th.bw-sortable {

        user-select: none;
    }

    table.bw-table th.bw-sortable:hover {

    }

    .bw-sort-arrow {

    table.bw-table tbody tr:hover {

    .bw-badge.sail {
        background-color: rgba(31, 119, 180, 0.15);

    }

    .bw-badge.pending {
        opacity: 0.7;

    .bw-badge.cancelled {

    }

    #bw-status {
        color: var(color, #666);

    }

    #bw-last-update {
        font-size: 0.8em;
        color: var(color, #666);
