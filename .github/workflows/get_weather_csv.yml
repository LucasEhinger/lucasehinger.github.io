name: Weather Data Update

on:
  workflow_dispatch: # Allows manual trigger only

jobs:
  update-weather:
    runs-on: ubuntu-latest
    permissions:
      contents: write # this workflow commits refreshed CSVs back to the repo

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install herbie-data numpy xarray
    
    - name: Run weather script
      run: python scripts/weather_to_csv.py
    
    - name: Commit and push if changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add files/weather/csv/*.csv
        git diff --quiet && git diff --staged --quiet && { echo "No changes to commit."; exit 0; }
        git commit -m "Update weather csv's"
        # A manual push (or another workflow) can land on master mid-run and
        # leave this push non-fast-forward. Rebase and retry rather than
        # failing the run.
        for attempt in 1 2 3 4 5; do
          if git push; then
            echo "Pushed on attempt $attempt."
            exit 0
          fi
          echo "Push rejected (attempt $attempt); rebasing onto latest master..."
          git pull --rebase origin master
        done
        echo "Failed to push after multiple attempts." >&2
        exit 1