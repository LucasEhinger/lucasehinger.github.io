name: Bluewater Sailing Stats Update

on:
  schedule:
    # Run daily at 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch: # Allows manual trigger

jobs:
  update-bluewater:
    runs-on: ubuntu-latest
    permissions:
      contents: write # this workflow commits refreshed data back to the repo

    steps:
      - name: Checkout website repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Clone the Bluewater scraper
        run: git clone --depth 1 https://github.com/LucasEhinger/BluewaterExperienceScraper.git scraper_repo

      # Only re-scrape the last year (through the present month) rather than all
      # of history — historical data is static, so this keeps the daily run light
      # on MIT's calendar server. The window is merged into the committed dataset.
      # The MIT calendar server occasionally drops a request; the scraper retries
      # internally, and this outer loop covers the rest (a whole-run failure
      # leaves the dataset untouched, so retrying is always safe).
      - name: Scrape the last year (writes sailing_events.csv)
        working-directory: scraper_repo
        run: |
          export SCRAPE_START_YEAR=$(( $(date +%Y) - 1 ))
          export SCRAPE_START_MONTH=1
          echo "Scraping ${SCRAPE_START_YEAR}-01 through the present month"
          for attempt in 1 2 3; do
            python experienceScraper.py && exit 0
            echo "attempt ${attempt} failed; retrying in 60s"
            sleep 60
          done
          exit 1

      # bluewater_merge.py replaces *every* committed event inside the --since
      # window with what the scrape produced, so a partial scrape would silently
      # delete a year of history. Refuse to merge an implausibly small window.
      - name: Sanity-check the scraped window
        run: |
          ROWS=$(( $(wc -l < scraper_repo/sailing_events.csv) - 1 ))
          echo "Scrape produced ${ROWS} event-participant rows"
          if [ "$ROWS" -lt 100 ]; then
            echo "::error::Only ${ROWS} rows for a one-year window (expected 100+); refusing to merge."
            exit 1
          fi

      - name: Merge the recent window into the existing dataset
        run: |
          SINCE="$(( $(date +%Y) - 1 ))-01"
          python scripts/bluewater_merge.py \
            files/bluewater/bluewater_data.json \
            scraper_repo/sailing_events.csv \
            files/bluewater/bluewater_data.json \
            --since "$SINCE"

      - name: Commit and push if changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add files/bluewater/bluewater_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Bluewater sailing stats" && git push)
