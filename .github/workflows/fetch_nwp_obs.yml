name: Fetch NWP at Observation Times

# Downloads forecast fields valid AT each summit observation time, for three
# leads (~1 h, ~24 h, ~48 h), from every model whose archive covers that date.
#
# This replaces the date-based sampling the old regen_weather_csv.yml job used,
# which pinned the Herbie init to 00Z and took fxx 1-8 -- fields valid 8pm-3am
# local, the night before the noon image each row was labeled against.
#
# Inputs are committed, so a run needs no setup:
#   files/weather/obs/nwp_sample.csv    which observation times to fetch
# Build it first if it is stale:
#   python3 scripts/fetch_iem_metar.py --cache <dir>
#   python3 scripts/build_undercast_record.py --cache <dir> --validate
#   python3 scripts/sample_undercast_obs.py --neg-per-pos 5
#
# Shards are independent and resumable: re-running with the same shard count
# skips (observation, lead) pairs already present in that shard's output, so a
# throttled or timed-out shard can simply be re-run.
#
# Output is plain CSV on purpose. git zlib-compresses blobs already, so .gz is
# the same size on first commit but costs a full new copy on every re-run
# (+33 MB) where raw CSV deltas to +0.8 MB. Since this job is BUILT to be
# re-run, that difference compounds. The files are excluded from the Jekyll
# build in _config.yml so ~80 MB of training data is not served on the site.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Number of parallel shards (must match across re-runs)"
        # Measured ~26 s per (observation, lead) at 6 workers, so 73,635 tasks is
        # ~540 single-machine hours. 120 shards puts each job near 4.5 h, under
        # the 6 h cap with margin. Capped at 20 concurrent, that is ~6 waves.
        # Runners may well beat a laptop's S3 throughput; if a shard does time
        # out, re-run the workflow with the SAME shard count and --resume skips
        # everything already fetched.
        default: "120"
      workers:
        description: "Worker processes per shard. Downloads are network-bound, but the NOAA S3 buckets throttle -- going much above 6 mostly buys 503s."
        default: "6"
      leads:
        description: "Target forecast leads in hours, space separated"
        default: "1 24 48"
      limit:
        description: "Max (observation, lead) tasks per shard. 0 = no cap."
        default: "0"
      only:
        description: "Run just these matrix entries, e.g. 0-19. Blank = all. Use WITH the same `shards` value as the real run so the sharding math is identical and the rows stay resume-compatible."
        default: ""

concurrency:
  group: fetch-nwp-obs
  cancel-in-progress: false

jobs:
  plan:
    # Turn the shard-count input into a matrix. GitHub has no native way to
    # build a dynamic matrix from a number, so emit the index list as JSON.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - id: mk
        env:
          SHARDS: ${{ github.event.inputs.shards }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          n = int(os.environ["SHARDS"])
          only = (os.environ.get("ONLY") or "").strip()
          if only:
              # A subset of the SAME n-way split. Running 0-19 of a 120-shard
              # plan rehearses the pipeline in one 20-job wave while keeping the
              # index % n == shard arithmetic identical to the full run, so the
              # rows it writes land in the files the full run will resume from.
              lo, _, hi = only.partition("-")
              shards = list(range(int(lo), int(hi or lo) + 1))
              if not shards or max(shards) >= n:
                  raise SystemExit(f"`only` ({only}) out of range for shards={n}")
          else:
              shards = list(range(n))
          print("matrix=" + json.dumps(shards))
          PY

  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350 # safety margin under the 360-minute job cap
    strategy:
      fail-fast: false # one throttled shard must not kill the rest
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        # herbie-data is deliberately unpinned: 2024.8.0 cannot read the current
        # ECMWF open-data index and silently returns 3 of 23 fields for IFS.
        # Anything from 2026.3.0 on is fine. The version is logged so a bad run
        # can be traced to it.
        run: |
          python -m pip install --upgrade pip
          pip install herbie-data numpy xarray
          python -c "import herbie; print('herbie', herbie.__version__)"

      - name: Fetch this shard
        run: |
          python scripts/fetch_nwp_at_obs.py \
            --sample files/weather/obs/nwp_sample.csv \
            --output-dir files/weather/csv/obs \
            --num-shards ${{ github.event.inputs.shards }} \
            --shard ${{ matrix.shard }} \
            --workers ${{ github.event.inputs.workers }} \
            --leads ${{ github.event.inputs.leads }} \
            --limit ${{ github.event.inputs.limit }} \
            --resume

      - name: Stage only this shard's own output
        # The output directory also holds every OTHER shard's file, because the
        # checkout carries whatever a previous run committed. Uploading the glob
        # put all 20 files in all 20 artifacts, and `merge-multiple` then had 20
        # jobs racing to write the same 20 paths -- which produced files with
        # valid content followed by thousands of NUL bytes. Copy just this
        # shard's file to a clean directory so each artifact holds exactly one.
        run: |
          mkdir -p upload
          f="files/weather/csv/obs/nwp_obs_shard_$(printf '%03d' ${{ matrix.shard }}).csv"
          test -f "$f" || { echo "::error::$f was not produced"; exit 1; }
          cp "$f" upload/
          ls -l upload/

      - uses: actions/upload-artifact@v7
        with:
          name: nwp-obs-shard-${{ matrix.shard }}
          path: upload/*.csv
          if-no-files-found: error
          retention-days: 14

  collect:
    needs: fetch
    if: always() # commit whatever shards finished
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v8
        with:
          pattern: nwp-obs-shard-*
          merge-multiple: true
          path: files/weather/csv/obs

      - name: Verify shard integrity
        # Fail loudly rather than committing data that parses but is wrong. The
        # concurrent-write bug above produced exactly that: plausible line
        # counts, correct header, NUL padding in the tail.
        run: |
          python - <<'PY'
          import csv, glob, sys
          bad = []
          for p in sorted(glob.glob("files/weather/csv/obs/*.csv")):
              raw = open(p, "rb").read()
              if b"\x00" in raw:
                  bad.append(f"{p}: {raw.count(bytes([0]))} NUL bytes (concurrent write)")
                  continue
              with open(p, newline="") as fh:
                  rows = list(csv.DictReader(fh))
              for i, r in enumerate(rows):
                  if not (r.get("valid_utc") or "").startswith("20"):
                      bad.append(f"{p} row {i}: bad valid_utc {r.get('valid_utc')!r}"); break
                  if r.get("is_undercast") not in ("0", "1"):
                      bad.append(f"{p} row {i}: is_undercast={r.get('is_undercast')!r} "
                                 f"-- columns are shifted"); break
              seen = {(r["valid_utc"], r["target_lead_h"]) for r in rows}
              if len(seen) != len(rows):
                  bad.append(f"{p}: {len(rows)-len(seen)} duplicate (obs, lead) rows")
          if bad:
              print("::error::shard integrity check FAILED")
              for b in bad: print("  " + b)
              sys.exit(1)
          print(f"integrity OK across {len(glob.glob('files/weather/csv/obs/*.csv'))} shard files")
          PY

      - name: Report coverage and fill rates
        # A throttled fetch and a genuinely missing field both leave an empty
        # cell, so check this before trusting the data. A model far below its
        # neighbours within its own date range means throttling, not a short
        # archive.
        run: |
          pip install pandas
          python - <<'PY'
          import glob, pandas as pd
          paths = sorted(glob.glob("files/weather/csv/obs/*.csv"))
          print(f"{len(paths)} shard files")
          if not paths:
              raise SystemExit("no shard output collected")
          df = pd.concat([pd.read_csv(p) for p in paths], ignore_index=True)
          print(f"{len(df):,} rows, {df.shape[1]} columns")
          print(f"observations: {df.valid_utc.nunique():,}   "
                f"positives: {int(df.is_undercast.sum()):,}")
          print("\nrows per split:")
          print(df.groupby(["split", "target_lead_h"]).size().to_string())
          print("\nfill rate by model (within its own archive window):")
          for m in ("hrrr", "nam", "nbm", "gfs", "rap", "ecmwf"):
              cols = [c for c in df.columns
                      if c.endswith(f"_{m}") and not c.startswith(("lead_", "meta_"))]
              have = df[df[f"lead_{m}"].notna()]
              if not len(have):
                  print(f"  {m:6s} no rows"); continue
              pct = 100 * have[cols].notna().to_numpy().mean()
              print(f"  {m:6s} {len(have):7,} rows covered   {pct:5.1f}% of cells filled")
          PY

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f files/weather/csv/obs/*.csv
          git diff --staged --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "Fetch NWP fields at summit observation times (3 leads)"
          # The 6-hourly weather workflow can land on master mid-run, so rebase
          # onto the latest remote and retry rather than failing the job.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto latest master..."
            git pull --rebase origin master
          done
          echo "Failed to push after multiple attempts." >&2
          exit 1
