name: Strava Activity Update

on:
  schedule:
    # Once a day, early morning US Eastern.
    - cron: "0 10 * * *"
  workflow_dispatch: # Allows manual trigger

# Never let two runs commit on top of each other.
concurrency:
  group: strava-update
  cancel-in-progress: false

jobs:
  update-strava:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # Incremental: reads the newest date out of the committed
      # files/strava/activities.json and only asks Strava for what came after,
      # so a daily run is one API call even though the history is 1,600+ rides.
      - name: Fetch new activities
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          # Home/office coordinates stripped from every committed track. Absent
          # in a fork or a misconfigured repo, the sync warns loudly rather than
          # silently publishing them.
          STRAVA_PRIVACY_ZONES: ${{ secrets.STRAVA_PRIVACY_ZONES }}
        run: python scripts/strava_sync.py

      # Rematches summits from scripts/cache/tracks.json. Overpass is only
      # queried for map tiles that aren't already in scripts/cache/osm_peaks.json,
      # so this is usually a purely local computation. Allowed to fail: the
      # public Overpass mirrors are flaky, and a bad day there shouldn't hold
      # back the activity data.
      - name: Match peaks
        id: peaks
        continue-on-error: true
        run: python scripts/strava_peaks.py

      # Regroups repeated running routes from scripts/cache/run_tracks.json.
      # Purely local computation — no network, no external service — so unlike
      # the peak step this one is expected to succeed and is not allowed to fail
      # quietly.
      - name: Group run routes
        run: python scripts/strava_runs.py

      # Detailed GPS streams for any new hike/trail run/ski tour that reaches
      # the White Mountains — usually zero or one activity, so usually zero or
      # one API call. Summary polylines are too coarse to score trail coverage
      # against; see the note at the top of strava_streams.py.
      - name: Fetch White Mountain tracks
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_PRIVACY_ZONES: ${{ secrets.STRAVA_PRIVACY_ZONES }}
        run: python scripts/strava_streams.py

      # Rescores trail coverage from the committed caches. Purely local — the
      # trail network itself comes from scripts/wm_trails.py, which queries
      # Overpass and is run by hand, not here.
      - name: Score trail coverage
        run: python scripts/wm_coverage.py

      - name: Commit and push if changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add files/strava/*.json files/strava/*.geojson scripts/cache/*.json
          git diff --quiet && git diff --staged --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "Update Strava activity data"
          # A manual push (or another workflow) can land on master mid-run and
          # leave this push non-fast-forward. Rebase and retry rather than
          # failing the run.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto latest master..."
            git pull --rebase origin master
          done
          echo "Failed to push after multiple attempts." >&2
          exit 1

      - name: Flag Overpass failure
        if: steps.peaks.outcome == 'failure'
        run: |
          echo "::warning::Peak matching failed (likely Overpass throttling)." \
               "Activity data was still updated; peaks will retry tomorrow."
